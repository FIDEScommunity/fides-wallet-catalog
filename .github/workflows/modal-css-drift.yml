name: Modal CSS drift

# Only run when the distributed modal stylesheet (or this workflow) changes.
# WordPress export pushes touch data/wp-export/wallet.json and must not trigger this.
# Canonical drift is enforced in fides-community-tools-tiles (Modal Drift Check).
# This job is a consumer-side extra: tiles is private, so checkout may fail and
# that is ignored — no PAT on this public repo.
on:
  pull_request:
    paths:
      - 'wordpress-plugin/fides-wallet-catalog/assets/lib/fides-catalog-ui.css'
      - '.github/workflows/modal-css-drift.yml'
  push:
    branches:
      - main
    paths:
      - 'wordpress-plugin/fides-wallet-catalog/assets/lib/fides-catalog-ui.css'
      - '.github/workflows/modal-css-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modal-css-drift:
    name: Modal CSS drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out wallet catalog
        uses: actions/checkout@v6

      - name: Check out canonical modal library
        id: canonical
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: FIDEScommunity/fides-community-tools-tiles
          path: canonical

      - name: Require canonical modal stylesheet
        if: steps.canonical.outcome == 'success'
        run: |
          canonical="canonical/lib/fides-catalog-ui/fides-catalog-ui.css"
          distributed="wordpress-plugin/fides-wallet-catalog/assets/lib/fides-catalog-ui.css"
          if ! cmp -s "$canonical" "$distributed"; then
            echo "::error file=$distributed::Modal CSS differs from the canonical fides-community-tools-tiles stylesheet. Run scripts/sync-catalog-modal-library.sh from fides-community-tools-tiles and commit the synced copy."
            diff -u "$canonical" "$distributed" || true
            exit 1
          fi

      - name: Skip when tiles is not readable
        if: steps.canonical.outcome != 'success'
        run: |
          echo "Could not check out private fides-community-tools-tiles from this public repo."
          echo "Canonical modal drift is enforced by Modal Drift Check in fides-community-tools-tiles."
